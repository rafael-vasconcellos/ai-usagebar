name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ref:
        description: "Existing release tag to build (e.g. v0.13.1)"
        required: true
        default: ""

permissions:
  contents: read

jobs:
  verify-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0

      - id: check
        name: Tag, Cargo.toml, and changelog must agree
        env:
          RELEASE_REF: ${{ inputs.ref || github.ref_name }}
        run: |
          set -euo pipefail
          ref="$RELEASE_REF"
          case "$ref" in
            v*) ;;
            *) echo "::error::refusing to publish from '$ref' — releases must build a vX.Y.Z tag"; exit 1 ;;
          esac
          version="${ref#v}"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::'$ref' is not a vX.Y.Z tag"; exit 1
          fi
          git rev-parse -q --verify "refs/tags/$ref" >/dev/null \
            || { echo "::error::tag '$ref' does not exist"; exit 1; }

          fail=0
          check() { # check <what> <actual> <expected>
            if [ "$2" != "$3" ]; then
              echo "::error::$1 is '$2' but the tag says '$3'"; fail=1
            fi
          }
          check "Cargo.toml version" \
            "$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)" "$version"

          grep -q "^## \[$version\]" CHANGELOG.md \
            || { echo "::error::CHANGELOG.md has no '## [$version]' section"; fail=1; }

          [ "$fail" -eq 0 ] || exit 1
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "verified $ref"

  build:
    needs: [verify-version]
    runs-on: windows-latest
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: x86_64-pc-windows-msvc

      - uses: ilammy/setup-nasm@72793074d3c8cdda771dba85f6deafe00623038b # v1

      - name: Test
        run: cargo test --release --target x86_64-pc-windows-msvc

      - name: Build release binaries
        run: cargo build --release --target x86_64-pc-windows-msvc --locked

      - name: Create zip archive
        run: |
          STAGE=$(mktemp -d)
          cp target/x86_64-pc-windows-msvc/release/ai-usagebar.exe \
             target/x86_64-pc-windows-msvc/release/ai-usagebar-tui.exe \
             "$STAGE/"
          cp LICENSE README.md config.example.toml "$STAGE/"
          ARTIFACT="ai-usagebar-windows-x86_64"
          (cd "$STAGE" && 7z a "$GITHUB_WORKSPACE/${ARTIFACT}.zip" .)
          rm -rf "$STAGE"

      - name: Compute SHA256
        run: |
          ARTIFACT="ai-usagebar-windows-x86_64"
          SHA=$(sha256sum ${ARTIFACT}.zip | awk '{print $1}')
          echo "$SHA  ${ARTIFACT}.zip" > ${ARTIFACT}.zip.sha256
          echo "Built ${ARTIFACT}.zip sha256=$SHA"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ai-usagebar-windows-x86_64
          path: |
            ai-usagebar-windows-x86_64.zip
            ai-usagebar-windows-x86_64.zip.sha256

  release:
    needs: [verify-version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout source (for CHANGELOG + previous tag)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate release body
        env:
          TAG: ${{ inputs.ref || github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          PREV_TAG=$(git tag --sort=-v:refname | grep -Fxv "$TAG" | head -1)

          awk -v ver="$VERSION" '
            BEGIN { hdr = "## [" ver "]" }
            index($0, hdr) == 1 { flag=1; next }
            flag && index($0, "## [") == 1 { exit }
            flag { print }
          ' CHANGELOG.md > changelog_section.md

          {
            if [ -s changelog_section.md ]; then
              echo "## What's changed"
              echo
              cat changelog_section.md
            fi

            echo "## Install"
            echo
            echo "Download \`ai-usagebar-windows-x86_64.zip\` from assets below and extract \`ai-usagebar.exe\` and \`ai-usagebar-tui.exe\`."
            echo
            echo "## Checksums (SHA256)"
            echo '```'
            cat artifacts/*.sha256
            echo '```'

            if [ -n "$PREV_TAG" ]; then
              echo
              echo "**Full diff**: https://github.com/${GITHUB_REPOSITORY}/compare/${PREV_TAG}...${TAG}"
            fi
          } > body.md

      - name: Create / update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_REF: ${{ inputs.ref || github.ref_name }}
        run: |
          TAG="$RELEASE_REF"

          # Remove all previous releases so the repository only keeps a single release
          OLD_RELEASES=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 | awk '{print $1}')
          for rel in $OLD_RELEASES; do
            if [ "$rel" != "$TAG" ]; then
              echo "Deleting old release: $rel"
              gh release delete "$rel" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
            fi
          done

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/*.zip artifacts/*.sha256 \
              --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file body.md
          else
            gh release create "$TAG" artifacts/*.zip artifacts/*.sha256 \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" \
              --notes-file body.md \
              --latest
          fi

  publish-crates-io:
    needs: [verify-version, build, release]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || inputs.ref != ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::warning::Skipping crates.io publish — no CARGO_REGISTRY_TOKEN secret set"
            exit 0
          fi
          log="${RUNNER_TEMP:-/tmp}/cargo-publish.log"
          set +e
          cargo publish 2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -eq 0 ]; then
            exit 0
          fi
          if grep -q "crate ai-usagebar@.* already exists on crates.io index" "$log"; then
            echo "::warning::Skipping crates.io publish — ${GITHUB_REF_NAME#v} already exists"
            exit 0
          fi
          exit "$status"
